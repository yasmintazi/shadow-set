<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #09080b; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #09080b; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #ffeccc; font: 600 22px Georgia, serif; letter-spacing: 0.08em; }
    #bar { width: 240px; height: 4px; margin-top: 18px; background: #2a2420; }
    #fill { width: 0; height: 100%; background: #ffc864; transition: width 0.2s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">SHADOW SET<div id="bar"><div id="fill"></div></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true
    }, function (p) { document.querySelector("#fill").style.width = (p * 100) + "%"; })
      .then(function () { document.querySelector("#loading").remove(); canvas.focus(); })
      .catch(function (e) { document.querySelector("#loading").textContent = e; });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  </script>
</body>
</html>
